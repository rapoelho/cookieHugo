<div class="homeCover">
	{{ partial "nav.html" . }}
	
	<div class="coverContent">
		<h2 class="titleHuge">{{ hugo.Data.homeCover.title }}</h2>
		<h2 class="subTitle">{{ hugo.Data.homeCover.subtitle }}</h2>
	 
		{{ if hugo.Data.homeCover.links }}
			<ul class="coverMenu">  
				{{ range hugo.Data.homeCover.links }}
					<li>
						<a class="{{ if .huge }}huge{{ end }}" href="{{ .link | safeURL }}">
							{{ .title }}
						</a>
					</li>
				{{ end }}
			</ul>
		{{ end }}
	</div>
</div>
