{{ define "main" }}
	<div class="postContent">
		
			<h1>{{ .Title }}</h1>
		
			{{ partial "postInfo.html" . }}

			{{ partial "postCover.html" . }}
		
			{{ if .Params.toc }}
				{{ partial "toc.html" . }}
			{{ end }}
		
		<main data-pagefind-body>
			{{ .Content }}
		</main>	
		
	</div>
{{ end }}
