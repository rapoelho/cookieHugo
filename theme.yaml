name: cookieHugo
description: A cozy, dark, and lightweight theme based on the Catppuccin Mocha palette. Designed for tech blogs and art portfolios with built-in client-side search (powered by Pagefind) and smart pagination.
homepage: https://github.com/rapoelho/cookieHugo 

tags:
  - blog
  - portfolio
  - dark
  - minimal
  - search
  - i18n
  - catppuccin
  - responsive

features:
  - Client-side search with Pagefind
  - Smart SEO indexing control
  - Multi-language support (i18n)
  - Modern SCSS with Catppuccin Mocha colors
  - Static and Page Bundle image support with automated ALT tags

